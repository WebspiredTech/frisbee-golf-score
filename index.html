<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frisbeegolf Scoreboard</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #131a2e;
        --muted: #93a0c2;
        --text: #f3f6ff;
        --accent: #56d6a2;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1000px 600px at 20% -10%, #1b2450, var(--bg));
        color: var(--text);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .card {
        background: linear-gradient(180deg, #1a2240 0%, var(--card) 100%);
        border: 1px solid #2b3866;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
      }
      h1 { margin: 0 0 8px 0; font-size: 28px; }
      .muted { color: var(--muted); margin: 0 0 12px 0; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      input, button, select {
        border: 1px solid #31406f;
        background: #0f1530;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 15px;
      }
      input, select { min-width: 180px; }
      button { cursor: pointer; }
      button.primary { background: #173f34; border-color: #2d8f70; }
      button.ghost { background: transparent; }
      button.danger { background: #3f1f27; border-color: #8a3648; }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 12px;
      }
      th, td {
        border-bottom: 1px solid #28355e;
        text-align: center;
        padding: 10px 6px;
      }
      th:first-child, td:first-child {
        text-align: left;
        padding-left: 12px;
      }
      .score-cell { min-width: 110px; }
      .score-controls {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .score-val {
        display: inline-block;
        min-width: 28px;
        font-weight: 700;
      }
      .small-btn {
        padding: 4px 8px;
        border-radius: 8px;
      }
      .leader {
        color: var(--accent);
        font-weight: 700;
      }
      .footer {
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
      }

      .active-player-row td {
        background: rgba(86, 214, 162, 0.12);
      }

      .quick-score-card {
        border: 2px solid #3a5fa4;
      }

      .status-line {
        font-size: 16px;
        margin: 0 0 10px 0;
      }

      .hole-nav {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }

      .hole-pill {
        font-weight: 700;
        padding: 8px 12px;
        border-radius: 10px;
        background: #101c40;
        border: 1px solid #31406f;
      }

      .quick-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .big-btn {
        font-size: 20px;
        font-weight: 700;
        min-width: 72px;
      }

      @media (max-width: 700px) {
        .container { padding: 12px; }
        th, td { padding: 8px 4px; }
        .score-cell { min-width: 92px; }

        .quick-score-card {
          position: sticky;
          bottom: 8px;
          z-index: 20;
          backdrop-filter: blur(4px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>🥏 Frisbeegolf Scoreboard</h1>
        <p class="muted">Välj antal banor, lägg till spelare, räkna poäng med + / −. Sparas i localStorage.</p>

        <div class="row" style="margin-bottom: 10px">
          <label>
            Antal banor:
            <input id="holesInput" type="number" min="1" max="36" value="9" />
          </label>
          <button id="applyHoles" class="primary">Sätt banor</button>
          <button id="resetAll" class="danger">Nollställ allt</button>
        </div>

        <div class="row">
          <input id="playerName" placeholder="Spelarnamn" />
          <button id="addPlayer" class="primary">Lägg till spelare</button>
        </div>
      </div>

      <div id="quickScoring" class="card quick-score-card" hidden>
        <p id="activeStatus" class="status-line"></p>

        <div class="row" style="margin-bottom: 10px;">
          <label>
            Välj spelare:
            <select id="activePlayerSelect"></select>
          </label>
        </div>

        <div class="hole-nav">
          <button id="prevHole" class="ghost">← Hål</button>
          <span id="holePill" class="hole-pill"></span>
          <button id="nextHole" class="ghost">Hål →</button>
        </div>

        <div class="quick-actions">
          <button id="quickDec" class="big-btn">−</button>
          <button id="quickInc" class="big-btn primary">+</button>
          <button id="incAll" class="primary">+1 till alla på hålet</button>
        </div>
      </div>

      <div class="card">
        <div id="leaderBoard"></div>
        <div style="overflow-x:auto; margin-top: 10px;">
          <table id="scoreTable"></table>
        </div>
        <div class="footer">Lägre totalpoäng leder.</div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'frisbee-scoreboard-v2';

      const loaded = loadState();
      const state = loaded || {
        holes: 9,
        players: [],
        activePlayerId: null,
        activeHole: 0
      };

      const holesInput = document.getElementById('holesInput');
      const applyHolesBtn = document.getElementById('applyHoles');
      const resetBtn = document.getElementById('resetAll');
      const playerNameInput = document.getElementById('playerName');
      const addPlayerBtn = document.getElementById('addPlayer');
      const table = document.getElementById('scoreTable');
      const leaderBoard = document.getElementById('leaderBoard');

      const quickScoring = document.getElementById('quickScoring');
      const activeStatus = document.getElementById('activeStatus');
      const activePlayerSelect = document.getElementById('activePlayerSelect');
      const holePill = document.getElementById('holePill');
      const prevHoleBtn = document.getElementById('prevHole');
      const nextHoleBtn = document.getElementById('nextHole');
      const quickIncBtn = document.getElementById('quickInc');
      const quickDecBtn = document.getElementById('quickDec');
      const incAllBtn = document.getElementById('incAll');

      holesInput.value = state.holes;
      normalizeState();

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);

          // fallback from older version
          const oldRaw = localStorage.getItem('frisbee-scoreboard-v1');
          if (oldRaw) {
            const old = JSON.parse(oldRaw);
            return {
              holes: old.holes || 9,
              players: old.players || [],
              activePlayerId: old.players?.[0]?.id || null,
              activeHole: 0
            };
          }

          return null;
        } catch {
          return null;
        }
      }

      function normalizeState() {
        if (!Number.isInteger(state.holes) || state.holes < 1) state.holes = 9;
        if (!Array.isArray(state.players)) state.players = [];

        state.players.forEach(ensureScoreLength);

        if (!state.players.some(p => p.id === state.activePlayerId)) {
          state.activePlayerId = state.players[0]?.id || null;
        }

        if (!Number.isInteger(state.activeHole)) state.activeHole = 0;
        state.activeHole = Math.min(Math.max(state.activeHole, 0), state.holes - 1);
      }

      function ensureScoreLength(player) {
        if (!Array.isArray(player.scores)) player.scores = [];
        while (player.scores.length < state.holes) player.scores.push(0);
        if (player.scores.length > state.holes) player.scores = player.scores.slice(0, state.holes);
      }

      function total(player) {
        return player.scores.reduce((a, b) => a + b, 0);
      }

      function getActivePlayer() {
        return state.players.find(p => p.id === state.activePlayerId) || null;
      }

      function updateLeaders() {
        if (state.players.length === 0) {
          leaderBoard.innerHTML = '<p class="muted">Ingen spelare ännu.</p>';
          return;
        }

        const totals = state.players.map(p => ({ name: p.name, total: total(p) }));
        const best = Math.min(...totals.map(t => t.total));
        const leaders = totals.filter(t => t.total === best).map(t => t.name);

        leaderBoard.innerHTML = `<strong>Ledare:</strong> <span class="leader">${leaders.join(', ')}</span> <span class="muted">(${best} poäng)</span>`;
      }

      function setActivePlayer(playerId) {
        if (!state.players.some(p => p.id === playerId)) return;
        state.activePlayerId = playerId;
      }

      function incrementScore(playerId, hole, delta) {
        const player = state.players.find(p => p.id === playerId);
        if (!player) return;
        if (hole < 0 || hole >= state.holes) return;

        player.scores[hole] = Math.max(0, player.scores[hole] + delta);
      }

      function incrementAllPlayersOnActiveHole() {
        for (const player of state.players) {
          player.scores[state.activeHole] = Math.max(0, player.scores[state.activeHole] + 1);
        }
      }

      function renderQuickScoring() {
        const hasPlayers = state.players.length > 0;
        quickScoring.hidden = !hasPlayers;

        if (!hasPlayers) return;

        activePlayerSelect.innerHTML = state.players
          .map((p) => `<option value="${p.id}" ${p.id === state.activePlayerId ? 'selected' : ''}>${p.name}</option>`)
          .join('');

        const activePlayer = getActivePlayer();
        const activeName = activePlayer ? activePlayer.name : 'Ingen';

        activeStatus.innerHTML = `Du ändrar nu: <strong class="leader">${activeName}</strong>`;
        holePill.textContent = `Hål ${state.activeHole + 1} av ${state.holes}`;
      }

      function render() {
        normalizeState();

        const headerCells = ['<th>Spelare</th>'];
        for (let i = 1; i <= state.holes; i++) headerCells.push(`<th>H${i}</th>`);
        headerCells.push('<th>Total</th>');
        headerCells.push('<th></th>');

        let html = `<thead><tr>${headerCells.join('')}</tr></thead><tbody>`;

        for (const player of state.players) {
          const scoreCells = player.scores.map((s, idx) => {
            return `<td class="score-cell">
              <div class="score-controls">
                <button class="small-btn" data-action="dec" data-player="${player.id}" data-hole="${idx}">−</button>
                <span class="score-val">${s}</span>
                <button class="small-btn" data-action="inc" data-player="${player.id}" data-hole="${idx}">+</button>
              </div>
            </td>`;
          }).join('');

          const rowClass = player.id === state.activePlayerId ? 'active-player-row' : '';

          html += `<tr class="${rowClass}">
            <td>${player.name}</td>
            ${scoreCells}
            <td><strong>${total(player)}</strong></td>
            <td><button class="small-btn danger" data-action="remove-player" data-player="${player.id}">Ta bort</button></td>
          </tr>`;
        }

        html += '</tbody>';
        table.innerHTML = html;

        renderQuickScoring();
        updateLeaders();
        saveState();
      }

      applyHolesBtn.addEventListener('click', () => {
        const v = Number(holesInput.value);
        if (!Number.isInteger(v) || v < 1 || v > 36) {
          alert('Ange antal banor mellan 1 och 36.');
          return;
        }
        state.holes = v;
        state.activeHole = Math.min(state.activeHole, state.holes - 1);
        render();
      });

      addPlayerBtn.addEventListener('click', () => {
        const name = playerNameInput.value.trim();
        if (!name) return;
        const newPlayer = {
          id: crypto.randomUUID(),
          name,
          scores: Array(state.holes).fill(0)
        };
        state.players.push(newPlayer);
        if (!state.activePlayerId) state.activePlayerId = newPlayer.id;
        playerNameInput.value = '';
        render();
      });

      playerNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addPlayerBtn.click();
      });

      resetBtn.addEventListener('click', () => {
        if (!confirm('Nollställa hela rundan?')) return;
        state.players = [];
        state.activePlayerId = null;
        state.activeHole = 0;
        saveState();
        render();
      });

      activePlayerSelect.addEventListener('change', (e) => {
        setActivePlayer(e.target.value);
        render();
      });

      prevHoleBtn.addEventListener('click', () => {
        state.activeHole = Math.max(0, state.activeHole - 1);
        render();
      });

      nextHoleBtn.addEventListener('click', () => {
        state.activeHole = Math.min(state.holes - 1, state.activeHole + 1);
        render();
      });

      quickIncBtn.addEventListener('click', () => {
        if (!state.activePlayerId) return;
        incrementScore(state.activePlayerId, state.activeHole, 1);
        render();
      });

      quickDecBtn.addEventListener('click', () => {
        if (!state.activePlayerId) return;
        incrementScore(state.activePlayerId, state.activeHole, -1);
        render();
      });

      incAllBtn.addEventListener('click', () => {
        if (state.players.length === 0) return;
        incrementAllPlayersOnActiveHole();
        render();
      });

      table.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const action = btn.dataset.action;
        const playerId = btn.dataset.player;
        const player = state.players.find(p => p.id === playerId);
        if (!player) return;

        if (action === 'remove-player') {
          state.players = state.players.filter(p => p.id !== playerId);
          if (state.activePlayerId === playerId) {
            state.activePlayerId = state.players[0]?.id || null;
          }
          render();
          return;
        }

        const hole = Number(btn.dataset.hole);
        if (!Number.isInteger(hole)) return;

        setActivePlayer(playerId);
        state.activeHole = hole;

        if (action === 'inc') incrementScore(playerId, hole, 1);
        if (action === 'dec') incrementScore(playerId, hole, -1);
        render();
      });

      render();
    </script>
  </body>
</html>
